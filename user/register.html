<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMART Library | Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css"  />
</head>

<body class="register-body">
  <main class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="register-wrapper">
      <div class="text-center mb-3">
        
        <div class="hero-icon index-icon">
            <img src="../assets/icons/logo.png" alt="Logo">
        </div>

        <div class="register-brand">SMART Library</div>
        <div class="register-subtitle">Create your account</div>
      </div>

      <div class="register-card">
        <!-- ADD ID HERE -->
        <form id="register-form">
          <!-- NAME ROW -->
          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="firstName" placeholder="" required>
            </div>
            <div class="col-md-6">
              <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="lastName" placeholder="" required>
            </div>
          </div>

          <!-- GENDER -->
          <div class="mb-3">
            <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
            <select id="gender" class="form-select" required>
              <option value="" disabled selected>Select gender</option>
              <option value="prefer">Prefer not to say</option>
              <option value="FEMALE">Female</option>
              <option value="MALE">Male</option>
              <option value="PREFER NOT TO SAY">Prefer Not To Say</option>
            </select>
          </div>

          <!-- CONTACT -->
          <div class="mb-3">
            <label for="contact" class="form-label">Contact Number <span class="text-danger">*</span></label>
            <input type="tel" class="form-control" id="contact" placeholder="" required>
          </div>

          <!-- EMAIL -->
          <div class="mb-3">
            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" placeholder="" required>
          </div>

          <!-- PASSWORD ROW -->
          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" class="form-control password-input" id="password" placeholder="" required>
                <button class="btn btn-outline-secondary toggle-password" type="button">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6">
              <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="password" class="form-control password-input" id="confirmPassword" placeholder="" required>
                <button class="btn btn-outline-secondary toggle-password" type="button">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- TERMS -->
          <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" id="termsCheckbox">
            <label class="form-check-label" for="termsCheckbox">
              I agree to the <a href="#" class="link-primary">Terms of Service</a> and
              <a href="#" class="link-primary">Privacy Policy</a>
            </label>
          </div>

          <!-- SUBMIT BUTTON -->
          <button type="submit" class="btn btn-primary w-100 register-submit-btn">
            Create Account
          </button>

          <!-- SIGN IN LINK -->
          <p class="text-center mt-3 mb-0 register-bottom-text">
            Already have an account?
            <a href="login.html" class="link-primary">Sign in here</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your main JS -->
  <script src="../assets/js/register.js"></script>
</body>
</html>
