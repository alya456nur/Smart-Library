<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMART Library | Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="dashboard-body">

  <main class="payment-wrapper">

    <div class="payment-card">

      <h5 class="mb-3">Pay Fine</h5>

      <!-- Fine Info -->
      <div class="pay-info-box">
        <div class="info-row">
          <span>Book Title</span>
          <strong id="bookTitle">-</strong>
        </div>
        <div class="info-row">
          <span>Fine Type</span>
          <strong>Overdue Fine</strong>
        </div>
        <div class="info-row">
          <span>Amount Due</span>
          <strong id="amountDue">RM0.00</strong>
        </div>
        <div class="info-row">
          <span>Issued Date</span>
          <strong id="issuedDate">-</strong>
        </div>
      </div>

      <div class="mt-3 mb-2 fw-semibold">Select Payment Method</div>

      <!-- Payment Methods -->
      <div class="payment-grid">
        <button class="method-card selected" data-method="Card">
            <i class="bi bi-credit-card"></i>
            Card
        </button>

        <button class="method-card" data-method="Cash">
            <i class="bi bi-cash"></i>
            Cash
        </button>
        </div>

      <div class="payment-actions">
        <a href="fines.html" class="btn btn-light">Cancel</a>
        <button id="payBtn" class="btn btn-primary">
          Pay RM0.00
        </button>
      </div>

    </div>

  </main>

</body>
</html>
<script src="../assets/js/public.js"></script>
<script src="../assets/js/payment.js"></script>
