<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMART Library | Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="register-body">

  <main class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="register-wrapper">

      <!-- Top text -->
      <div class="text-center mb-3">
        <div class="hero-icon index-icon">
          <img src="../assets/icons/logo.png" alt="Logo">
        </div>

        <div class="register-brand">SMART Library</div>
        <div class="register-subtitle">Reset your password</div>
      </div>

      <!-- Card -->
      <div class="register-card">
        <form id="forgot-form">

          <!-- Email Field -->
          <div class="mb-3">
            <label for="email" class="form-label">
              Email Address <span class="text-danger">*</span>
            </label>
            <div class="input-group">
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your registered email"
                required
              />
              <button class="btn btn-outline-secondary" type="button">
                <i class="bi bi-envelope"></i>
              </button>
            </div>
            <small class="text-muted d-block mt-2">
              Enter the email address associated with your account.
            </small>
          </div>

          <!-- New Password -->
          <div class="mb-3">
            <label for="newPassword" class="form-label">
              New Password <span class="text-danger">*</span>
            </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control password-input"
                id="newPassword"
                required
              />
              <button class="btn btn-outline-secondary toggle-password" type="button">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <small class="text-muted d-block mt-2">
              Use at least 6 characters.
            </small>
          </div>

          <!-- Confirm New Password -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">
              Confirm New Password <span class="text-danger">*</span>
            </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control password-input"
                id="confirmPassword"
                required
              />
              <button class="btn btn-outline-secondary toggle-password" type="button">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100 register-submit-btn">
            Update Password
          </button>
        </form>
      </div>

      <!-- Back to login -->
      <p class="text-center mt-3 mb-0 register-bottom-text">
        Remember your password?
        <a href="login.html" class="link-primary">Back to login</a>
      </p>

    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Forgot Password JS -->
  <script src="../assets/js/forgot-password.js"></script>
</body>
</html>
