<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMART Library | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="register-body">

  <main class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="register-wrapper">

      <!-- Top text -->
      <div class="text-center mb-3">

        <div class="hero-icon index-icon">
            <img src="../assets/icons/logo.png" alt="Logo">
        </div>
        
        <div class="register-brand">SMART Library</div>
        <div class="register-subtitle">Sign in to your account</div>
      </div>

      <!-- Card -->
      <div class="register-card">
        <form id="login-form">
          <!-- Email -->
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email"
                   placeholder="" required>
          </div>

          <!-- Password -->
          <div class="mb-2">
            <label for="loginPassword" class="form-label">Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="password" class="form-control password-input" id="loginPassword"
                     placeholder="" required>
              <button class="btn btn-outline-secondary toggle-password" type="button">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember + Forgot -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a href="forgot-password.html" class="link-primary login-forgot-link">Forgot password?</a>
          </div>

          <!-- Sign In button -->
          <button type="submit" class="btn btn-primary w-100 register-submit-btn">
            Sign In
          </button>

          <!-- Bottom text -->
          <p class="text-center mt-3 mb-0 register-bottom-text">
            Don't have an account?
            <a href="register.html" class="link-primary">Register here</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your main JS (password toggle + validation) -->
  <script src="../assets/js/login.js"></script>
</body>
</html>
