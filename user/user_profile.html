<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMART Library |Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="dashboard-body">
  <!-- NAVBAR (same as home) -->
  <header class="top-nav">
    <div class="nav-inner dashboard-nav">
      <div class="nav-brand d-flex align-items-center">
        <div class="hero-icon index-icon me-2">
          <img src="../assets/icons/logo.png" alt="Logo">
        </div>
        <span class="fw-semibold">SMART Library</span>
      </div>

      <div class="dashboard-user ms-auto d-flex align-items-center">
        <div class="text-end me-3">
          <div class="dashboard-user-name" id="navUserName"></div>
          <div class="dashboard-user-email" id="navUserEmail"></div>
        </div>

        <a href="#" id="logoutBtn" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </a>
      </div>
    </div>
  </header>

  <main class="dashboard-wrapper">

    <!-- SUMMARY CARDS -->
    <section class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-icon bg-summary-blue">
            <img src="../assets/icons/library.png" alt="Books" class="icon-img">
          </div>
          <div class="summary-label">Available Books</div>
          <div class="summary-value" id="sumAvailable">0</div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-icon bg-summary-purple">
            <img src="../assets/icons/library-1.png" alt="Books" class="icon-img">
          </div>
          <div class="summary-label">Currently Borrowed</div>
          <div class="summary-value" id="sumBorrowed">0</div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-icon bg-summary-red">
            <img src="../assets/icons/library-2.png" alt="Books" class="icon-img">
          </div>
          <div class="summary-label">Overdue Books</div>
          <div class="summary-value" id="sumOverdue">0</div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-icon bg-summary-gold">
            <img src="../assets/icons/library-3.png" alt="Books" class="icon-img">
          </div>
          <div class="summary-label">Current Fines</div>
          <div class="summary-value" id="sumFines">RM0.00</div>
        </div>
      </div>
    </section>

    <!-- TABS -->
    <section class="dashboard-tabs mb-3">
      <ul class="nav nav-pills">
        <li class="nav-item">
          <a href="user_home.html" class="nav-link">Browse</a>
        </li>
        <li class="nav-item">
          <a href="recommendation.html" class="nav-link">AI Picks</a>
        </li>
        <li class="nav-item">
          <a href="borrow.html" class="nav-link">My Books</a>
        </li>
        <li class="nav-item">
          <a href="requests.html" class="nav-link">Requests</a>
        </li>
        <li class="nav-item">
          <a href="fines.html" class="nav-link">Fines</a>
        </li>
        <li class="nav-item">
          <a href="user_profile.html" class="nav-link active">Profile</a>
        </li>
      </ul>
    </section>

    <section class="personal-info">
      <h5>
        Personal Information 
        <a href="#" id="btnSaveProfile" class="float-end text-decoration-none d-none">
          <i class="bi bi-check-lg"></i> Save
        </a>
      </h5>

      <div class="info-row">
        <div class="info-item">
          <label>First Name:</label>
          <div class="info-value" data-field="firstName"></div>
          <input type="text" class="form-control d-none" data-field="firstName">
        </div>
        <div class="info-item">
          <label>Last Name:</label>
          <div class="info-value" data-field="lastName"></div>
          <input type="text" class="form-control d-none" data-field="lastName">
        </div>
      </div>

      <div class="info-row">
        <div class="info-item">
          <label>Gender:</label>
          <div class="info-value" data-field="gender"></div>
          <select class="form-select d-none" data-field="gender">
            <option value="">Select</option>
            <option value="MALE">MALE</option>
            <option value="FEMALE">FEMALE</option>
            <option value="PREFER NOT TO SAY">PREFER NOT TO SAY</option>
          </select>
        </div>
        <div class="info-item">
          <label>Contact Number:</label>
          <div class="info-value" data-field="contact"></div>
          <input type="text" class="form-control d-none" data-field="contact">
        </div>
      </div>

      <div class="info-row full-width">
        <div class="info-item">
          <label>Email Address:</label>
          <div class="info-value" data-field="email"></div>
          <input type="email" class="form-control d-none" data-field="email">
        </div>
      </div>

      <div class="info-row full-width">
        <div class="info-item">
          <label>Member Since:</label>
          <div class="info-value" data-field="memberSince"></div>
        </div>
      </div>
    </section>


<section class="liked-books mt-4">
  <h5>Liked Books</h5>
  <div class="col-md-4">
  <div class="book-card">
    <img src="../assets/images/sample-book-3.jpg" alt="Book Cover">
    <div class="book-info">
      <div class="book-title">The Silent Patient</div>
      <div class="book-author">Alex Michaelides</div>
      <div class="book-genre">Mystery</div>
    </div>
  </div>
</div>
</section>



 </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/user_profile.js"></script>
  <script src="../assets/js/public.js"></script>
  <script src="../assets/js/summary-cards.js"></script>

  
</body>
</html>
