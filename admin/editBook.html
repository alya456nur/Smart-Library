<!DOCTYPE html>
<html lang="en">
<head>
    <title>SMART Library | Edit Book</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <div id="content">
        <div class="top-navbar mb-4">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <button type="button" id="sidebarCollapse" class="btn btn-info mr-3">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h3 class="m-0 text-dark">SMART Library System</h3>
                </div>
                <div>
                    <i class="fas fa-user-circle"></i> Sarah
                </div>
            </div>
        </div>
        <h3 class="text-center mb-4 font-weight-bold">EDIT BOOK</h3>

        <div class="content-box p-4" style="background-color: #a8d0db; border-radius: 15px;">
            <form id="bookForm" action="" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Book ID:</label>
                            <input type="text" name="book_id" id="bookIdInput" value="" class="form-control bg-white" disabled>
                        </div>
                        <div class="form-group">
                            <label>Author ID:</label>
                            <input type="text" name="author_id" id="authorIdInput" value="" class="form-control bg-white" placeholder="Enter Author ID (e.g., A001)">
                            <!-- Author name display area -->
                            <div id="authorNameDisplay" class="mt-1"></div>
                        </div>
                        <div class="form-group">
                            <label>Author Name:</label>
                            <input type="text" name="author_name" id="authorNameInput" value="" class="form-control bg-white" 
                                placeholder="Enter Author Name">
                        </div>
                        <div class="form-group">
                            <label>Title:</label>
                            <input type="text" name="title" id="titleInput" value="" class="form-control bg-white">
                        </div>
                        <div class="form-group">
                            <label>Genre:</label>
                            <input type="text" name="genre" id="genreInput" value="" class="form-control bg-white">
                        </div>
                        <div class="form-group">
                            <label>Description:</label>
                            <textarea name="desc" id="descInput" class="form-control bg-white" rows="1"></textarea>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Publisher:</label>
                            <input type="text" name="publisher" id="publisherInput" value="" class="form-control bg-white">
                        </div>
                        <div class="form-group">
                            <label>ISBN:</label>
                            <input type="text" name="isbn" id="isbnInput" value="" class="form-control bg-white">
                        </div>
                        <div class="form-group">
                            <label>Publication Date:</label>
                            <input type="date" id="pubDateInput" class="form-control bg-white">
                        </div>
                        <div class="form-group">
                            <label>Book Status:</label>
                            <select id="statusSelect" class="form-control bg-white">
                                <option value="Available">Available</option>
                                <option value="Unavailable">Unavailable</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Book Cover:</label>
                            <input type="file" class="form-control-file" id="coverInput" name="cover" accept="image/*">
                            <small class="form-text text-muted">Leave empty to keep current cover.</small>

                            <!-- Optional: preview -->
                            <img id="coverPreview" alt="" style="display:none; margin-top:10px; max-width:180px; border-radius:8px;">
                        </div>
                    </div>
                </div>

                <div class="text-right mt-4">
                    <button type="button" class="btn btn-primary px-4" onclick="saveBook()">Save</button>    
                    <button type="button" class="btn btn-secondary px-4 ml-2" onclick="resetForm()">Reset</button>
                </div>
            </form>
        </div>
        
        <div class="mt-3">
            <a href="bookInventory.html" class="btn btn-outline-dark">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/editBook.js"></script>

</body>
</html>
