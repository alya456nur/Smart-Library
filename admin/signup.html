<!DOCTYPE html>
<html>
<head>
    <title>SMART Library | Sign Up</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body style="background-color: #dcecef;">

<div class="signup-container">
    <div class="login-header">
        <i class="fas fa-book-open fa-2x"></i>
        <span>SMART Library System</span>
    </div>

    <div class="login-body">

        <!-- ✅ no action/redirect; handled by JS -->
        <form id="addLibrarianForm">
            <div class="row">
                <div class="col-md-6">

                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">First Name:</label>
                        <div class="col-sm-8">
                            <input id="fname" type="text" class="form-control" placeholder="Enter First Name">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">Last Name:</label>
                        <div class="col-sm-8">
                            <input id="lname" type="text" class="form-control" placeholder="Enter Last Name">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">Gender:</label>
                        <div class="col-sm-8">
                            <select id="gender" class="form-control">
                                <option value="">Select</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-4 col-form-label">Contact Number:</label>
                        <div class="col-sm-8">
                            <input id="contact" type="text" class="form-control" placeholder="Enter Contact Number">
                        </div>
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label">Email:</label>
                        <div class="col-sm-9">
                            <input id="email" type="email" class="form-control" placeholder="Enter Email">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label">Password:</label>
                        <div class="col-sm-9">
                            <input id="password" type="password" class="form-control" placeholder="Enter Password">
                        </div>
                    </div>

                    <div class="text-right mt-5">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 font-weight-bold">
                            Add Librarian
                        </button>
                    </div>

                </div>
            </div>
        </form>

        <div class="mt-3">
            <a href="manageLibrarian.html" class="btn btn-outline-dark">
                 <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>

    </div>
</div>

<script src="../assets/js/AddLibrarian.js"></script>
</body>
</html>
