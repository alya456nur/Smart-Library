<!DOCTYPE html>
<html lang="en">
<head>
  <title>SMART Library | Book Inventory</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="style.css">

    <style>
        /* ✅ Smaller cover image */
        .cover-img {
        width: 55px;
        height: 75px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid rgba(0,0,0,0.15);
        background: #fff;
        }
        .img-cell { width: 80px; }

        .status-badge {
        padding: 5px 10px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.9rem;
        display: inline-block;
        }
        .status-available { background: #e8f5e9; color: #1b5e20; }
        .status-unavailable { background: #ffebee; color: #b71c1c; }

        /* ✅ TABLE SCROLL */
        .table-scroll {
        max-height: 520px;      /* adjust height you want */
        overflow-y: auto;
        overflow-x: auto;       /* if table becomes wide */
        }

        /* ✅ Sticky header while scrolling */
        .table-scroll thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #f8f9fa;    /* same as thead-light */
        }
    </style>

</head>

<body>
<div class="wrapper" style="min-height: 100vh;">
  <nav id="sidebar" style="min-height: 100vh; display: flex; flex-direction: column;">
    <div class="sidebar-header pl-4 pt-4">
      <h4>SMART LIBRARY</h4>
    </div>

    <ul class="list-unstyled components">
      <li><a href="adminDashboard.html">Dashboard</a></li>
      <li><a href="borrowManagement.html">Book Request</a></li>
      <li class="active"><a href="bookInventory.html">Book Inventory</a></li>
      <li><a href="borrowList.html">Borrow List</a></li>
      <li><a href="manageFine.html">Manage Fine</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="manageLibrarian.html">Manage Librarian</a></li>
    </ul>

    <div class="mt-auto pl-4 pt-5 pb-4">
      <a href="logout.html" id="logoutBtn">Log Out</a>
    </div>
  </nav>

  <div id="content">
    <div class="top-navbar mb-4">
      <div class="d-flex align-items-center">
        <button type="button" id="sidebarCollapse" class="btn btn-info mr-3">
          <i class="fas fa-bars"></i>
        </button>
        <h3 class="m-0 text-dark">SMART Library System</h3>
      </div>
    </div>

    <div class="text-center mb-4">
      <h2 class="font-weight-bold">BOOK INVENTORY</h2>
    </div>

    <div class="content-box p-4" style="background-color: #a8d0db; border-radius: 15px;">

      <div class="row mb-3">
        <div class="col-md-8">
          <div class="d-flex">
            <input type="text" id="searchInput" class="form-control mr-2"
                   placeholder="Search by Title, ISBN or Author..." />
            <button class="btn btn-primary" id="searchBtn">Search</button>
            <button class="btn btn-secondary ml-2" id="resetBtn">Reset</button>
          </div>
        </div>

        <div class="col-md-4 text-right">
          <a href="addBook.html" class="btn btn-primary">+ Add New Book</a>
        </div>
      </div>

      <div class="bg-white p-3 shadow-sm" style="border-radius: 10px;">
        <div class="bg-white p-3 shadow-sm" style="border-radius: 10px;">
            <div class="table-scroll">
                <table class="table table-hover mb-0">
                    <thead class="thead-light">
                        <tr>
                            <th>ISBN</th>
                            <th>Book Cover</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Status</th>
                            <th style="width: 160px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="bookTbody"></tbody>
                </table>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/bookInventory.js"></script>
</body>
</html>
