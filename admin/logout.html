<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART Library | Logged Out</title>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #dcecef;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .icon-box {
            color: #17a2b8; /* Teal color */
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="logout-card">
        <div class="icon-box">
            <i class="fas fa-sign-out-alt fa-4x"></i>
        </div>
        <h3 class="font-weight-bold mb-3">See You Soon!</h3>
        <p class="text-muted mb-4">You have been successfully logged out of the SMART Library System.</p>
        
        <a href="adminLogin.html" class="btn btn-custom btn-block rounded-pill">Return to Login</a>
    </div>

</body>
</html>
