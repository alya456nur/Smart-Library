<!DOCTYPE html>
<html lang="en">
<head>
    <title>SMART Library | Add New Book</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <div id="content">

        <div class="top-navbar mb-4">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <h3 class="m-0 text-dark">SMART Library System</h3>
                </div>
                <div>
                    <i class="fas fa-user-circle"></i> Sarah
                </div>
            </div>
        </div>

        <h3 class="text-center mb-4 font-weight-bold">ADD NEW BOOK</h3>

        <div class="content-box p-4" style="background-color: #a8d0db; border-radius: 15px;">
            <form id="addBookForm" enctype="multipart/form-data" onsubmit="return false;">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Author ID: <span class="text-danger">*</span></label>
                            <input type="text" name="author_id" class="form-control" placeholder="Enter Author ID (e.g., A001)" required>
                            <small id="authorIdFeedback" class="form-text"></small>
                        </div>
                        <div class="form-group">
                            <label>Author Name: <span class="text-danger">*</span></label>
                            <input type="text" name="author_name" class="form-control" placeholder="Enter Author Name" required>
                            <small id="authorNameFeedback" class="form-text"></small>
                        </div>
                        <div class="form-group">
                            <label>Title: <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" placeholder="Enter Title" required>
                        </div>
                        <div class="form-group">
                            <label>Genre: <span class="text-danger">*</span></label>
                            <input type="text" name="genre" class="form-control" placeholder="Enter Genre" required>
                        </div>
                        <div class="form-group">
                            <label>Description:</label>
                            <textarea name="desc" class="form-control" placeholder="Enter description" rows="1"></textarea>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Publisher: <span class="text-danger">*</span></label>
                            <input type="text" name="publisher" class="form-control" placeholder="Enter Publisher" required>
                        </div>
                        <div class="form-group">
                            <label>ISBN: <span class="text-danger">*</span></label>
                            <input type="text" name="isbn" class="form-control" placeholder="Enter ISBN" required>
                            <small class="form-text text-muted">Must be unique across all books</small>
                        </div>
                        <div class="form-group">
                            <label>Publication Date:</label>
                            <input type="date" name="pub_date" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Book Status:</label>
                            <select name="status" class="form-control">
                                <option value="Available">Available</option>
                                <option value="Unavailable">Unavailable</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Book Cover:</label>
                            <input type="file" name="cover" class="form-control-file" accept="image/*">
                        </div>
                    </div>
                </div>

                <div class="text-right mt-4">
                    <button type="button" class="btn btn-primary px-4" onclick="addNewBook()">Add Book</button>
                    <button type="button" class="btn btn-secondary px-4 ml-2" onclick="resetAddForm()">Reset</button>
                </div>
            </form>
        </div>

        <div class="mt-3">
            <a href="bookInventory.html" class="btn btn-outline-dark">
                 <i class="fas fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</div>

<script src="../assets/js/addBook.js"></script>
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script src="../assets/js/script.js"></script>

</body>
</html>
