<!DOCTYPE html>
<html>
<head>
    <title>SMART Library | Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body style="background-color: #dcecef;">

<div class="login-container">
    <div class="login-header">
        <i class="fas fa-book-open fa-2x"></i>
        <span>SMART Library System</span>
    </div>
    <div class="login-body">
        <form id="adminLoginForm" method="post"> <div class="input-group mb-3">
                <div class="input-group-prepend">
                    <span class="input-group-text border-0 bg-white"><i class="fas fa-user"></i></span>
                </div>
                <input id="ID" type="text" name="id" class="form-control border-0" placeholder="Librarian ID" required>
            </div>

            <div class="input-group mb-4">
                <div class="input-group-prepend">
                    <span class="input-group-text border-0 bg-white"><i class="fas fa-lock"></i></span>
                </div>
                <input id="password" type="password" name="password" class="form-control border-0" placeholder="Password" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom px-5">LOG IN</button>
            </div>
        </form>
    </div>
</div>

<script src="../assets/js/adminLogin.js"></script>

</body>
</html>
