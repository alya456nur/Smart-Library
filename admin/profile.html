<!DOCTYPE html>
<html lang="en">
<head>
    <title>SMART Library | Profile</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper" style="min-height: 100vh;">
    <nav id="sidebar" style="min-height: 100vh; display: flex; flex-direction: column;">
        <div class="sidebar-header pl-4 pt-4">
            <h4>SMART LIBRARY</h4>
        </div>

        <ul class="list-unstyled components">
            <li><a href="adminDashboard.html">Dashboard</a></li>
            <li><a href="borrowManagement.html">Book Request</a></li>
            <li><a href="bookInventory.html">Book Inventory</a></li>
            <li><a href="borrowList.html">Borrow List</a></li>
            <li><a href="manageFine.html">Manage Fine</a></li>
            <li class="active"><a href="profile.html">Profile</a></li>
            <li><a href="manageLibrarian.html">Manage Librarian</a></li>
        </ul>
        
        <div class="mt-auto pl-4 pt-5 pb-4">
             <a href="logout.html" id="logoutBtn">Log Out</a>
        </div>
    </nav>

    <div id="content">
        
        <div class="top-navbar mb-4">
            <div class="d-flex align-items-center">
                <button type="button" id="sidebarCollapse" class="btn btn-info mr-3">
                    <i class="fas fa-bars"></i>
                </button>
                <h3 class="m-0 text-dark">SMART Library System</h3>
            </div>
        </div>

        <div class="text-center mb-4">
            <h2 class="font-weight-bold">PROFILE</h2>
        </div>

        <div class="content-box p-4" style="background-color: #a8d0db; border-radius: 15px;">
            <form>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label font-weight-bold">Librarian ID:</label>
                            <div class="col-sm-8">
                                <input type="text" id="id" class="form-control" disabled style="background-color: rgba(255,255,255,0.5);">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label font-weight-bold">First Name:</label>
                            <div class="col-sm-8">
                                <input type="text" id="fname" class="form-control bg-white">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label font-weight-bold">Last Name:</label>
                            <div class="col-sm-8">
                                <input type="text" id="lname" class="form-control bg-white">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label font-weight-bold">Gender:</label>
                            <div class="col-sm-8">
                                <select id="gender" class="form-control bg-white">
                                    <option value="FEMALE">Female</option>
                                    <option value="MALE">Male</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-4 col-form-label font-weight-bold">Contact No:</label>
                            <div class="col-sm-8">
                                <input type="text" id="contact" class="form-control bg-white">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label font-weight-bold">Email:</label>
                            <div class="col-sm-9">
                                <input type="email" id="email" class="form-control bg-white">
                            </div>
                        </div>
                        <div class="form-group row">
                            <label class="col-sm-3 col-form-label font-weight-bold">Password:</label>
                            <div class="col-sm-9">
                                <input type="password" id="password" class="form-control bg-white" value="">
                                <small class="text-muted d-block mt-1">Leave blank if you don't want to change password.</small>
                            </div>
                        </div>

                        <div class="text-right mt-4">
                        <button type="button" class="btn btn-primary px-4" onclick="saveProfile()">Save Changes</button>    
                        <button type="button" class="btn btn-secondary px-4 ml-2" onclick="resetProfile()">Reset</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/admin-profile.js"></script>

</body>
</html>
